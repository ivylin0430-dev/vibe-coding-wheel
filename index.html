<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎀 今晚吃什麼？療癒系命運轉盤</title>
    <style>
        :root {
            --bg-color: #FFF0F5;      /* 薰衣草紅 (淺粉底色) */
            --primary: #FF9BAD;       /* 柔和粉紅色 */
            --primary-hover: #FF7C95; /* 深一點的粉紅 */
            --text-main: #5C4B51;     /* 柔和的深灰棕色 */
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: var(--primary-hover);
            margin-bottom: 5px;
            font-size: 28px;
            text-shadow: 1px 1px 2px rgba(255, 155, 173, 0.2);
        }

        p {
            margin-top: 0;
            margin-bottom: 30px;
            color: #8A7B80;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 50px;
            max-width: 1000px;
            width: 100%;
        }

        /* 轉盤區塊 */
        .wheel-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 可愛的小指標 */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid #FF7C95;
            z-index: 10;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.2));
        }

        canvas {
            background-color: var(--card-bg);
            border-radius: 50%;
            box-shadow: 0 12px 25px rgba(255, 155, 173, 0.25);
            transition: transform 3.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 8px solid white;
        }

        .controls { margin-top: 25px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 155, 173, 0.4);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #E0D8DB;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 清單管理區塊 */
        .list-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 155, 173, 0.15);
            width: 300px;
            display: flex;
            flex-direction: column;
        }

        .list-section h3 {
            margin-top: 0;
            color: var(--primary-hover);
            border-bottom: 2px dashed #FFE0E6;
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            padding: 10px 15px;
            border: 2px solid #FFE0E6;
            border-radius: 12px;
            flex-grow: 1;
            outline: none;
            color: var(--text-main);
            transition: border 0.3s;
        }

        input[type="text"]:focus { border-color: var(--primary); }

        .add-btn {
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 12px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        /* 捲軸美化 */
        ul::-webkit-scrollbar { width: 6px; }
        ul::-webkit-scrollbar-thumb { background-color: #FFE0E6; border-radius: 10px; }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #FFF0F5;
            transition: background 0.2s;
        }

        li:hover { background-color: #FFF0F5; border-radius: 8px; }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        /* 隱藏的選項加上刪除線 */
        .inactive-text {
            text-decoration: line-through;
            color: #B0A8AB;
        }

        /* 客製化 Checkbox */
        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .delete-btn {
            background-color: transparent;
            color: #FFB3C1;
            padding: 5px 8px;
            font-size: 14px;
            box-shadow: none;
            border-radius: 8px;
        }

        .delete-btn:hover { background-color: #FFE0E6; color: #FF7C95; }
    </style>
</head>
<body>

    <h1>🎀 今晚吃什麼？</h1>
    <p>勾選你想吃的食物，讓命運的轉盤幫你決定！(會自動記憶喔 ✨)</p>

    <div class="container">
        <!-- 輪盤區 -->
        <div class="wheel-section">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="380" height="380"></canvas>
            <div class="controls">
                <button id="spinBtn" onclick="spinWheel()">✨ 轉動好運 ✨</button>
            </div>
        </div>

        <!-- 選項管理區 -->
        <div class="list-section">
            <h3>📝 候選美食清單</h3>
            <div class="input-group">
                <input type="text" id="foodInput" placeholder="加點想吃的..." onkeypress="handleEnter(event)">
                <button class="add-btn" onclick="addFood()">新增</button>
            </div>
            <ul id="foodList"></ul>
        </div>
    </div>

   <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');

        // --- 畫質提升核心邏輯 ---
        const dpr = window.devicePixelRatio || 1; // 取得螢幕像素比例
        const size = 380; // 轉盤的邏輯尺寸

        // 設定 CSS 顯示尺寸
        canvas.style.width = size + 'px';
        canvas.style.height = size + 'px';
        // 設定 Canvas 實際渲染尺寸 (根據螢幕比例放大)
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        // 將繪圖座標系等比例放大，後續繪圖數值不需改變
        ctx.scale(dpr, dpr);
        // -----------------------
        
        // 預設資料 (包含文字與是否啟用)
        let defaultFoods = [
            { name: '🍜 豚骨拉麵', active: true },
            { name: '🍲 麻辣火鍋', active: true },
            { name: '🍱 壽司', active: true },
            { name: '🍔 漢堡薯條', active: true },
            { name: '🥗 健康餐盒', active: true },
            { name: '🥟 巷口水餃', active: false }
        ];

        // 實用邏輯：從 LocalStorage 讀取資料，若沒有才用預設值
        let foods = JSON.parse(localStorage.getItem('foodList')) || defaultFoods;
        
        // 馬卡龍粉嫩配色盤
        const colors = ['#FFB3C6', '#FFC8DD', '#FFAFCC', '#BDE0FE', '#A2D2FF', '#FCF6BD', '#D0F4DE', '#E4C1F9'];
        
        let currentRotation = 0;
        let isSpinning = false;

        // 儲存資料到本機
        function saveData() {
            localStorage.setItem('foodList', JSON.stringify(foods));
        }

        // 取得目前「有勾選」的食物
        function getActiveFoods() {
            return foods.filter(f => f.active);
        }

        // 畫出輪盤
        function drawWheel() {
            // 改用邏輯尺寸 (size) 清除畫布
            ctx.clearRect(0, 0, size, size); 
            const activeFoods = getActiveFoods();
            const centerX = size / 2;
            const centerY = size / 2;
            const radius = size / 2;

            if(activeFoods.length === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#F5ECEE';
                ctx.fill();
                ctx.fillStyle = '#B0A8AB';
                ctx.font = '18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('請至少勾選一個選項喔 🥺', centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / activeFoods.length;

            for (let i = 0; i < activeFoods.length; i++) {
                const angle = i * arcSize;
                
                // 畫扇形
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                
                // 畫白色的分隔線讓質感更好
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#FFFFFF';
                ctx.stroke();

                // 畫文字
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#5C4B51'; // 深色文字比較清楚
                ctx.font = 'bold 18px Microsoft JhengHei';
                ctx.fillText(activeFoods[i].name, radius - 25, 6);
                ctx.restore();
            }
        }

        // 更新清單 UI
        function updateListUI() {
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            
            foods.forEach((food, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="item-left" onclick="toggleFood(${index})">
                        <input type="checkbox" ${food.active ? 'checked' : ''} onclick="event.stopPropagation(); toggleFood(${index})">
                        <span class="${food.active ? '' : 'inactive-text'}">${food.name}</span>
                    </div>
                    <button class="delete-btn" onclick="removeFood(${index})">✖</button>
                `;
                list.appendChild(li);
            });
            
            saveData();
            drawWheel();
        }

        // 切換勾選狀態
        function toggleFood(index) {
            if (isSpinning) return;
            foods[index].active = !foods[index].active;
            updateListUI();
        }

        // 新增食物 (實用邏輯：防呆驗證)
        function addFood() {
            const input = document.getElementById('foodInput');
            const value = input.value.trim();
            
            if (!value) {
                alert('名字不能是空白的喔！');
                return;
            }
            if (foods.some(f => f.name === value)) {
                alert('這個項目已經在清單裡囉！');
                return;
            }
            if (foods.length >= 15) {
                alert('選項太多轉盤會看不清楚，先刪掉一些吧！');
                return;
            }

            foods.push({ name: value, active: true });
            input.value = '';
            updateListUI();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') addFood();
        }

        // 移除食物
        function removeFood(index) {
            if (isSpinning) return;
            foods.splice(index, 1);
            updateListUI();
        }

        // 旋轉邏輯
        function spinWheel() {
            const activeFoods = getActiveFoods();
            
            if (activeFoods.length < 2) {
                alert('至少要勾選兩個選項才能幫你做決定呀！🌸');
                return;
            }
            if (isSpinning) return;
            
            isSpinning = true;
            spinBtn.disabled = true;

            // 隨機旋轉圈數 (至少轉 5 圈 + 隨機角度)
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalRotation = 360 * 5 + extraDegrees;
            currentRotation += totalRotation;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // 動畫結束後計算結果
            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;
                calculateResult(activeFoods);
            }, 3500); // 對應 CSS 的 3.5s
        }

        // 計算並顯示結果
        function calculateResult(activeFoods) {
            const actualRotation = currentRotation % 360;
            const arcSize = 360 / activeFoods.length;
            
            // 計算指針指到的索引
            const pointerAngle = (360 - actualRotation + 270) % 360;
            const winningIndex = Math.floor(pointerAngle / arcSize);
            
            setTimeout(() => {
                alert(`✨ 命運的安排是：\n\n👉 ${activeFoods[winningIndex].name} 👈\n\n快去享用美食吧！`);
            }, 150);
        }

        // 網頁載入時初始渲染
        updateListUI();
    </script>
</body>
</html>
